spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/onboarding}
spring.datasource.username=${DB_USER:onboarding}
spring.datasource.password=${DB_PASSWORD:onboarding}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.port=8080
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.aes-key=${AES_KEY:0123456789abcdef0123456789abcdef}
app.jwt-secret=${JWT_SECRET:change-this-development-jwt-secret-please-2026}
app.admin-email=${ADMIN_EMAIL:admin@onboarding.local}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
app.admin-password=${ADMIN_PASSWORD:Admin2026!}
