services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: onboarding
      POSTGRES_USER: onboarding
      POSTGRES_PASSWORD: onboarding
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/database.sql:/docker-entrypoint-initdb.d/01.sql:ro
    ports: ["5432:5432"]
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/onboarding
      DB_USER: onboarding
      DB_PASSWORD: onboarding
      AES_KEY: ${AES_KEY:-0123456789abcdef0123456789abcdef}
      JWT_SECRET: ${JWT_SECRET:-change-this-development-jwt-secret-please-2026}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@onboarding.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin2026!}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on: [db]
    ports: ["8080:8080"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["5173:5173"]

volumes:
  postgres_data:
